name: niuma-office

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.35
    environment:
      POSTGRES_DB: niuma
      POSTGRES_USER: niuma
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - /srv/niuma-office/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niuma -d niuma"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: niuma-office-api:local
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4310
      PUBLIC_API_URL: https://api.alipayclaw.cn
      DATABASE_URL_FILE: /run/secrets/database_url
      NIUMA_ARK_API_KEY_FILE: /run/secrets/ark_api_key
      NIUMA_PLATFORM_MODEL_ID: doubao-seed-2-1-turbo-260628
      NIUMA_ARK_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
      NIUMA_ADMIN_TOKEN_FILE: /run/secrets/niuma_admin_token
    secrets:
      - database_url
      - ark_api_key
      - niuma_admin_token
    ports:
      - 127.0.0.1:4310:4310
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  releases:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    mem_limit: 48m
    cpus: 0.15
    ports:
      - 127.0.0.1:4311:8080
    volumes:
      - /srv/niuma-office/releases:/usr/share/nginx/html/releases:ro
      - /srv/niuma-office/releases/release-manifest.json:/usr/share/nginx/html/release-manifest.json:ro
      - ./nginx.download.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/release-manifest.json"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

networks:
  internal:
    driver: bridge

secrets:
  postgres_password:
    file: /etc/niuma-office/secrets/postgres_password
  database_url:
    file: /etc/niuma-office/secrets/database_url
  ark_api_key:
    file: /etc/niuma-office/secrets/ark_api_key
  niuma_admin_token:
    file: /etc/niuma-office/secrets/niuma_admin_token
