      <article class="document shell">
        <h1>问题反馈</h1>
        <p class="updated">当前为定向内部体验渠道</p>
        <p>请通过向你发放安装包的对接人提交问题。内部体验阶段不设置公开反馈表单，以免收集与问题排查无关的个人信息。</p>
        <h2>建议提供的信息</h2>
        <ul><li>牛马办公版本和 macOS 版本。</li><li>问题发生时间、任务标题和可复现步骤。</li><li>页面显示的错误状态，以及是否可以重新运行。</li><li>如需诊断记录，可在客户端“帮助与反馈”中打开本地诊断目录。</li></ul>
        <h2>提交前请检查</h2>
        <p>诊断记录默认不包含模型密钥，但文件名、任务标题或手动附加的截图可能包含业务信息。提交前请移除与问题无关的个人信息、客户资料和密钥。</p>
      </article>
    </main>
